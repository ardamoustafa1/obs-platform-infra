query:
  replicaCount: 3
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 12
    targetCPU: 60
    targetMemory: 70
    behavior:
      scaleDown: {stabilizationWindowSeconds: 300}
      scaleUp: {stabilizationWindowSeconds: 30}
  pdb: {create: true, minAvailable: 2}
  resources:
    requests: {cpu: "1", memory: 2Gi}
    limits: {cpu: "4", memory: 8Gi}
storegateway:
  replicaCount: 3
  pdb: {create: true, minAvailable: 2}
  resources:
    requests: {cpu: "1", memory: 2Gi}
    limits: {cpu: "4", memory: 8Gi}
compactor:
  concurrency: 4
  resources:
    requests: {cpu: "1", memory: 2Gi}
    limits: {cpu: "4", memory: 8Gi}
metrics: {enabled: true, serviceMonitor: {enabled: true}}

